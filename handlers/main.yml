---
- name: "nginx-deploy | Validate nginx configuration"
  ansible.builtin.command:
    cmd: "nginx -t"
  changed_when: false
  listen: "reload nginx"
- name: "nginx-deploy | Reload nginx service"
  ansible.builtin.systemd:
    name: "{{ hostvars[inventory_hostname]['nginx_service'] }}"
    state: "reloaded"
  listen: "reload nginx"
- name: "nginx-deploy | Restart nginx service"
  ansible.builtin.systemd:
    name: "{{ hostvars[inventory_hostname]['nginx_service'] }}"
    daemon_reload: "yes"
    state: "restarted"
  listen: "restart nginx"
